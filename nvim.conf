# ⌨️ Keybindings

### 🚨 Diagnostics

| Shortcut    | Action              |
| ----------- | ------------------- |
| `<leader>e` | Diagnostic Popup    |
| `[d`        | Previous Diagnostic |
| `]d`        | Next Diagnostic     |
| `<C-n>`     | Toggle Trouble      |

### 💻 Development

| Shortcut     | Action              |
| ------------ | ------------------- |
| `<leader>f`  | Format Current File |
| `<leader>gg` | Open LazyGit        |
| `<leader>gd` | Toggle Diffview     |
| `<leader>fp` | Find Files          |
| `<leader>fs` | Live Grep           |
| `<leader>v`  | Markdown Preview    |

