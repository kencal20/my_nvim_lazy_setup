-- ~/.config/nvim/lua/config/lazy.lua

-- Bootstrap lazy.nvim
local lazypath = vim.fn.stdpath("data") .. "/lazy/lazy.nvim"
if not vim.loop.fs_stat(lazypath) then
  vim.fn.system({
    "git",
    "clone",
    "--filter=blob:none",
    "--branch=stable",
    "https://github.com/folke/lazy.nvim.git",
    lazypath,
  })
end
vim.opt.rtp:prepend(lazypath)

require("lazy").setup({
  spec = {
    -- Core
    { "LazyVim/LazyVim", import = "lazyvim.plugins" },
    { import = "lazyvim.plugins.extras.lang.typescript" },
    { import = "lazyvim.plugins.extras.lang.json" },

    -- UI
    { "nvim-tree/nvim-web-devicons", lazy = false },
    {
      "nvim-tree/nvim-tree.lua",
      dependencies = { "nvim-tree/nvim-web-devicons" },
      opts = { view = { side = "right" } },
    },
    { "akinsho/bufferline.nvim", version = "*", dependencies = { "nvim-tree/nvim-web-devicons" } },

    -- Git Integration (VS Code style with smart toggle)
    {
      "sindrets/diffview.nvim",
      cmd = { "DiffviewOpen", "DiffviewClose", "DiffviewToggleFiles" },
      keys = {
        {
          "<leader>gd",
          function()
            -- Safe check: only check the view if the library is actually loaded
            local lib_loaded, lib = pcall(require, "diffview.lib")
            if lib_loaded and lib.get_current_view() then
              vim.cmd("DiffviewClose")
            else
              vim.cmd("DiffviewOpen")
            end
          end,
          desc = "Toggle DiffView (Side-by-Side)",
        },
      },
    },
    {
      "kdheepak/lazygit.nvim",
      cmd = { "LazyGit" },
      keys = {
        { "<leader>gg", "<cmd>LazyGit<cr>", desc = "LazyGit Dashboard" },
      },
    },

    -- Auto-save
    {
      "Pocco81/auto-save.nvim",
      config = function()
        require("auto-save").setup({ enabled = true })
      end,
    },

    -- Trouble
    { "folke/trouble.nvim", enabled = true },

    -- Completion
    { "hrsh7th/nvim-cmp", dependencies = { "hrsh7th/cmp-emoji" } },

    -- Telescope
    { "nvim-telescope/telescope.nvim", opts = { defaults = { layout_strategy = "horizontal" } } },

    -- LSP
    {
      "neovim/nvim-lspconfig",
      opts = {
        servers = {
          pyright = {},
          ts_ls = {},
          tailwindcss = {},
          html = {},
          cssls = {},
          jsonls = {},
          bashls = {}, -- <- add bash LSP
        }
      },
    },

    -- Mason
    {
      "mason-org/mason.nvim",
      lazy = false,
      config = function()
        require("mason").setup()
      end,
    },
    {
      "mason-org/mason-lspconfig.nvim",
      dependencies = { "mason-org/mason.nvim" },
      opts = { ensure_installed = { "ts_ls", "pyright", "tailwindcss", "html", "cssls", "jsonls", "bashls" } },
    },
    {
      "WhoIsSethDaniel/mason-tool-installer.nvim",
      dependencies = { "mason-org/mason.nvim" },
      opts = {
        ensure_installed = {
          "stylua",
          "prettier",
          "shfmt",
          "markdownlint",
          "shellcheck",
          "bash-language-server", -- <- automatic install
        },
        auto_update = false,
        run_on_start = true,
      },
    },

    -- Treesitter
    {
      "nvim-treesitter/nvim-treesitter",
      opts = {
        ensure_installed = {
          "bash",
          "html",
          "javascript",
          "json",
          "lua",
          "markdown",
          "python",
          "tsx",
          "typescript",
          "vim",
          "yaml",
        },
      },
    },

    -- Formatter
    {
      "mhartington/formatter.nvim",
      lazy = false,
      config = function()
        local formatter = require("formatter")
        formatter.setup({
          filetype = {
            lua = {
              function()
                return {
                  exe = "stylua",
                  args = { "--search-parent-directories", "-i", vim.api.nvim_buf_get_name(0) },
                  stdin = false,
                }
              end,
            },
            javascript = {
              function()
                return { exe = "prettier", args = { "--stdin-filepath", vim.api.nvim_buf_get_name(0) }, stdin = true }
              end,
            },
            typescript = {
              function()
                return { exe = "prettier", args = { "--stdin-filepath", vim.api.nvim_buf_get_name(0) }, stdin = true }
              end,
            },
          },
        })
        vim.keymap.set("n", "<leader>f", function()
          vim.cmd("Format")
        end)
      end,
    },

    -- Snippets
    { "L3MON4D3/LuaSnip" },
    {
      "rafamadriz/friendly-snippets",
      config = function()
        require("luasnip.loaders.from_vscode").lazy_load()
      end,
    },

    -- Statusline
    {
      "nvim-lualine/lualine.nvim",
      event = "VeryLazy",
      opts = function(_, opts)
        table.insert(opts.sections.lualine_x, function()
          return "😄"
        end)
      end,
    },

    -- Markdown Preview (Web-based)
    {
      "iamcco/markdown-preview.nvim",
      ft = "markdown",
      build = function()
        vim.fn["mkdp#util#install"]()
      end,
    },
  },

  defaults = { lazy = false },
})

-- Diagnostics
vim.diagnostic.config({
  virtual_text = true,
  signs = true,
  underline = true,
  update_in_insert = true,
  severity_sort = true,
})

-- Clipboard (cross-platform)
vim.opt.clipboard = "unnamedplus"
if vim.fn.has("win32") == 1 then
  vim.g.clipboard = {
    name = "win32yank",
    copy = { ["+"] = "win32yank.exe -i --crlf", ["*"] = "win32yank.exe -i --crlf" },
    paste = { ["+"] = "win32yank.exe -o --lf", ["*"] = "win32yank.exe -o --lf" },
    cache_enabled = 0,
  }
end

-- Keymaps
vim.keymap.set("n", "<leader>e", vim.diagnostic.open_float)
vim.keymap.set("n", "[d", vim.diagnostic.goto_prev)
vim.keymap.set("n", "]d", vim.diagnostic.goto_next)
vim.keymap.set("n", "<C-n>", function()
  require("trouble").toggle("diagnostics")
end)

-- Markdown preview keymap
vim.keymap.set("n", "<leader>v", function()
  vim.cmd("MarkdownPreviewToggle")
end, { desc = "Toggle Markdown Preview" })

-- ✅ Fix .env filetype
vim.filetype.add({
  filename = {
    [".env"] = "env",
    [".env.example"] = "env",
  },
  pattern = {
    [".*%.env%..*"] = "env",
  },
})
-- Create a test file: ~/.config/nvim/lua/test-icons.lua
local function test_icons()
  local devicons = require("nvim-web-devicons")
  
  print("Testing nvim-web-devicons...")
  print("Has loaded?", devicons.has_loaded())
  
  -- Test getting an icon
  local icon, hl_name = devicons.get_icon("init.lua", "lua")
  print("Icon for lua file:", icon, "Highlight:", hl_name)
  
  -- Test getting an icon with color
  local icon2, color = devicons.get_icon_color("init.lua", "lua")
  print("Icon for lua file with color:", icon2, "Color:", color)
  
  -- List all icons
  local icons = devicons.get_icons()
  print("\nTotal icons loaded:", #icons)
  
  -- Check if your font is patched
  print("\nTry this in command line to check font:")
  print(":echo &guifont")
  print("Or manually check if font is Nerd Font")
end

test_icons()
-- ~/.config/nvim/init.lua
require("config.lazy")
vim.opt.number = true
vim.opt.relativenumber = false
vim.opt.clipboard = "unnamedplus"

